name: Signed Mac release candidates

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to validate (blank uses the selected ref)
        required: false
        type: string

# This workflow uploads candidates and evidence only. It cannot publish a release.
permissions:
  contents: read
concurrency:
  group: signed-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Signed candidate (${{ matrix.arch }})
    environment: release-candidate
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      PLANNER_TARGET_ARCH: ${{ matrix.arch }}
      # Public desktop client IDs are baked into the bundled public configuration.
      PLANNER_GOOGLE_CLIENT_ID: ${{ vars.PLANNER_GOOGLE_CLIENT_ID }}
      PLANNER_MICROSOFT_CLIENT_ID: ${{ vars.PLANNER_MICROSOFT_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Check architecture and candidate version
        env:
          CANDIDATE_REF: ${{ github.ref }}
          CANDIDATE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          if (process.platform !== 'darwin' || process.arch !== process.env.PLANNER_TARGET_ARCH)
            throw new Error('Use a runner matching the candidate architecture.');
          const {version} = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$/.test(version)) throw new Error('Invalid package version.');
          const tag = process.env.CANDIDATE_REF?.replace(/^refs\/tags\//, '');
          if (process.env.CANDIDATE_EVENT === 'push' && tag !== 'v' + version)
            throw new Error('The tag must match package.json exactly.');
          fs.appendFileSync(process.env.GITHUB_ENV, 'PLANNER_CANDIDATE_VERSION=' + version + '\n');
          JS

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:desktop

      - name: Import temporary Developer ID signing material
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const required = ['APPLE_CERTIFICATE_P12_BASE64', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGN_IDENTITY',
            'APPLE_TEAM_ID', 'APPLE_API_KEY_BASE64', 'APPLE_API_KEY_ID', 'APPLE_API_ISSUER'];
          for (const name of required) if (!process.env[name]) throw new Error('Missing release secret: ' + name);
          if (!process.env.APPLE_SIGN_IDENTITY.startsWith('Developer ID Application:'))
            throw new Error('Use a Developer ID Application identity.');
          if (!/^[A-Za-z0-9]+$/.test(process.env.APPLE_API_KEY_ID)) throw new Error('Invalid Apple API key ID.');
          const directory = path.join(process.env.RUNNER_TEMP, 'planner-signing');
          fs.mkdirSync(directory, {recursive:true, mode:0o700});
          fs.writeFileSync(path.join(directory, 'certificate.p12'), Buffer.from(process.env.APPLE_CERTIFICATE_P12_BASE64, 'base64'), {mode:0o600});
          const apiKey = path.join(directory, 'AuthKey_' + process.env.APPLE_API_KEY_ID + '.p8');
          fs.writeFileSync(apiKey, Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64'), {mode:0o600});
          fs.appendFileSync(process.env.GITHUB_ENV, 'APPLE_API_KEY=' + apiKey + '\n');
          JS
          signing_dir="$RUNNER_TEMP/planner-signing"
          keychain_path="$signing_dir/candidate.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$signing_dir/certificate.p12" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" >/dev/null
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const directory = path.join(process.env.RUNNER_TEMP, 'planner-signing');
          const prior = execFileSync('security', ['list-keychains', '-d', 'user'], {encoding:'utf8'})
            .split('\n').map(line => line.trim().replace(/^"|"$/g, '')).filter(Boolean);
          fs.writeFileSync(path.join(directory, 'previous-keychains.json'), JSON.stringify(prior), {mode:0o600});
          execFileSync('security', ['list-keychains', '-d', 'user', '-s', ...prior, path.join(directory, 'candidate.keychain-db')]);
          JS
          security find-identity -v -p codesigning "$keychain_path" | grep -F -- "$APPLE_SIGN_IDENTITY" >/dev/null
          rm -f "$signing_dir/certificate.p12"

      - name: Make signed and notarized architecture-specific packages
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run make -- --arch="$PLANNER_TARGET_ARCH"

      - name: Verify signatures, notarization, and bundled runtime
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app_path="$PWD/out/Planner-darwin-$PLANNER_TARGET_ARCH/Planner.app"
          mkdir -p release-candidate/evidence
          binary_arch="$PLANNER_TARGET_ARCH"
          if [ "$binary_arch" = x64 ]; then binary_arch=x86_64; fi
          test "$(lipo -archs "$app_path/Contents/MacOS/Planner")" = "$binary_arch"
          test "$(lipo -archs "$app_path/Contents/Resources/runtime/node")" = "$binary_arch"
          test "$("$app_path/Contents/Resources/runtime/node" -p 'process.arch')" = "$PLANNER_TARGET_ARCH"
          codesign --verify --deep --strict --verbose=2 "$app_path" 2>release-candidate/evidence/app-signature.txt
          codesign -d --verbose=4 "$app_path" 2>release-candidate/evidence/signing-identity.txt
          grep -Fx -- "TeamIdentifier=$APPLE_TEAM_ID" release-candidate/evidence/signing-identity.txt >/dev/null
          xcrun stapler staple "$app_path" >release-candidate/evidence/app-staple.txt
          xcrun stapler validate "$app_path" >>release-candidate/evidence/app-staple.txt
          spctl --assess --type execute --verbose=2 "$app_path" 2>release-candidate/evidence/app-gatekeeper.txt
          cp "$app_path/Contents/Resources/runtime/architecture.json" release-candidate/evidence/runtime-architecture.json

      - name: Run packaged acceptance with a separate test profile
        run: |
          set -euo pipefail
          export PLANNER_EXECUTABLE="$PWD/out/Planner-darwin-$PLANNER_TARGET_ARCH/Planner.app/Contents/MacOS/Planner"
          node scripts/desktop-smoke.mjs
          cp -R test-results/native release-candidate/evidence/packaged-acceptance

      - name: Notarize and staple the signed DMG; recreate ZIP from the stapled app
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' dmg_path; do
            count=$((count + 1))
            test "$count" -eq 1
            candidate_dmg="release-candidate/Planner-$PLANNER_CANDIDATE_VERSION-$PLANNER_TARGET_ARCH.dmg"
            cp "$dmg_path" "$candidate_dmg"
            codesign --force --sign "$APPLE_SIGN_IDENTITY" --timestamp "$candidate_dmg"
            codesign --verify --strict --verbose=2 "$candidate_dmg" 2>release-candidate/evidence/dmg-signature.txt
            xcrun notarytool submit "$candidate_dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m --output-format json >release-candidate/evidence/dmg-notarization.json
            node --input-type=module -e 'import fs from "node:fs"; if(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).status!=="Accepted")throw new Error("DMG notarization was not accepted")' release-candidate/evidence/dmg-notarization.json
            xcrun stapler staple "$candidate_dmg" >release-candidate/evidence/dmg-staple.txt
            xcrun stapler validate "$candidate_dmg" >>release-candidate/evidence/dmg-staple.txt
            spctl --assess --type open --context context:primary-signature --verbose=2 "$candidate_dmg" 2>release-candidate/evidence/dmg-gatekeeper.txt
          done < <(find out/make -type f -name '*.dmg' -print0)
          test "$count" -eq 1
          ditto -c -k --sequesterRsrc --keepParent "$PWD/out/Planner-darwin-$PLANNER_TARGET_ARCH/Planner.app" "release-candidate/Planner-$PLANNER_CANDIDATE_VERSION-$PLANNER_TARGET_ARCH.zip"

      - name: Record checksums and candidate provenance
        env:
          CANDIDATE_REF: ${{ github.ref }}
          CANDIDATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const directory = 'release-candidate';
          const files = fs.readdirSync(directory).filter(name => /\.(dmg|zip)$/.test(name)).sort();
          if (files.length !== 2) throw new Error('Expected one DMG and one ZIP.');
          fs.writeFileSync(directory + '/SHA256SUMS.txt', files.map(name => createHash('sha256').update(fs.readFileSync(directory + '/' + name)).digest('hex') + '  ' + name).join('\n') + '\n');
          const provenance = {version:process.env.PLANNER_CANDIDATE_VERSION, architecture:process.env.PLANNER_TARGET_ARCH,
            commit:execFileSync('git', ['rev-parse','HEAD'], {encoding:'utf8'}).trim(), ref:process.env.CANDIDATE_REF,
            workflow:process.env.CANDIDATE_RUN_URL, builtAt:new Date().toISOString(),
            distribution:'candidate-only; no publication', remainingProof:['real account inference', 'provider authorization and approval', 'signed notification delivery', 'fresh downloaded install and upgrade recovery', 'public support/privacy URLs and registration review']};
          fs.writeFileSync(directory + '/candidate.json', JSON.stringify(provenance, null, 2) + '\n');
          JS

      - name: Upload validated candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Planner-signed-candidate-${{ matrix.arch }}-${{ github.run_id }}
          path: release-candidate/**
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material and restore keychain search list
        if: always()
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const directory = path.join(process.env.RUNNER_TEMP, 'planner-signing');
          const previous = path.join(directory, 'previous-keychains.json');
          const keychain = path.join(directory, 'candidate.keychain-db');
          try {
            if (fs.existsSync(previous)) execFileSync('security', ['list-keychains', '-d', 'user', '-s', ...JSON.parse(fs.readFileSync(previous,'utf8'))]);
          } finally {
            try {if(fs.existsSync(keychain))execFileSync('security', ['delete-keychain', keychain]);}
            finally {fs.rmSync(directory, {recursive:true, force:true});}
          }
          JS
